<html>
<head>
    <title>Form GET Example</title>
</head>
<body>
    <form  action="ServerGet.html" method="GET">
        <table border="1" cellpadding="0" cellspacing="0">
            <tr>
                <td>Nhập tên:</td>
                <td>
                    <input type="text" name="txtten" value="Obama">
                </td>
            </tr>
            <tr>
                <td>Nhập Email:</td>
                <td>
                    <input type="email" name="txtemail" value="Obama@gmail.com">
                </td>
            </tr>
        </table>
        <br>
        <input type="submit" value="Gửi thông tin">
    </form>
</body>
</html>
